<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Kyle Painter — Links</title>
  <meta name="description" content="Disruptors Media — links, resources, and what I'm working on." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kyle Painter — Links" />
  <meta property="og:description" content="Disruptors Media — links, resources, and what I'm working on." />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='50%25' y='54%25' font-family='-apple-system,system-ui,sans-serif' font-size='34' font-weight='700' fill='%2364D2FF' text-anchor='middle' dominant-baseline='middle'%3EK%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #000;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-strong: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f5f5f7;
      --text-muted: rgba(245, 245, 247, 0.55);
      --accent: #64D2FF;
      --accent-strong: #5AC8FA;
      --primary-bg: rgba(100, 210, 255, 0.14);
      --primary-border: rgba(100, 210, 255, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
    }

    body {
      background: #000;
      overflow-x: hidden;
    }

    #shader-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #shader-bg canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 0.55;
    }

    #shader-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.85) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.55) 100%);
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 520px;
      margin: 0 auto;
      padding: 56px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 28px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .avatar {
      position: relative;
      width: 106px;
      height: 106px;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 90% at 22% 14%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 30%, rgba(255, 255, 255, 0) 58%),
        linear-gradient(180deg, #101013 0%, #030305 100%);
      border: 1px solid rgba(100, 210, 255, 0.6);
      box-shadow:
        0 0 0 1px rgba(100, 210, 255, 0.15),
        0 0 22px rgba(100, 210, 255, 0.45),
        0 10px 36px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -10px 18px rgba(0, 0, 0, 0.55);
    }

    .avatar::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 23px;
      pointer-events: none;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 42%);
      mix-blend-mode: screen;
    }

    .avatar img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 0;
      font-size: 15px;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    nav.links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    a.link:hover {
      background: var(--surface-strong);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    a.link:active {
      transform: translateY(0) scale(0.99);
    }

    a.link--primary {
      background: var(--primary-bg);
      border-color: var(--primary-border);
    }

    a.link--primary:hover {
      background: rgba(100, 210, 255, 0.20);
      border-color: rgba(100, 210, 255, 0.50);
    }

    .icon {
      position: relative;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 22% 14%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 28%, rgba(255, 255, 255, 0) 55%),
        linear-gradient(180deg, #101013 0%, #030305 100%);
      border: 1px solid rgba(100, 210, 255, 0.55);
      box-shadow:
        0 0 0 1px rgba(100, 210, 255, 0.12),
        0 0 12px rgba(100, 210, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 -6px 10px rgba(0, 0, 0, 0.55);
      color: var(--accent);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .icon::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 11px;
      pointer-events: none;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 38%);
      mix-blend-mode: screen;
    }

    .icon svg {
      position: relative;
      z-index: 1;
    }

    a.link--primary .icon {
      border-color: rgba(100, 210, 255, 0.78);
      box-shadow:
        0 0 0 1px rgba(100, 210, 255, 0.22),
        0 0 18px rgba(100, 210, 255, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -6px 10px rgba(0, 0, 0, 0.55);
      color: var(--accent-strong);
    }

    a.link:hover .icon {
      border-color: rgba(100, 210, 255, 0.85);
      box-shadow:
        0 0 0 1px rgba(100, 210, 255, 0.25),
        0 0 20px rgba(100, 210, 255, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 -6px 10px rgba(0, 0, 0, 0.55);
    }

    .icon svg {
      width: 22px;
      height: 22px;
    }

    .icon img {
      position: relative;
      z-index: 1;
      width: 78%;
      height: 78%;
      object-fit: contain;
    }

    .text {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .url {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: -0.005em;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      flex: 0 0 auto;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      transition: transform 0.15s ease, color 0.2s ease;
    }

    a.link:hover .chevron {
      color: var(--text);
      transform: translateX(2px);
    }

    .socials {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    a.social {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      text-decoration: none;
      background:
        radial-gradient(120% 90% at 22% 14%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 28%, rgba(255, 255, 255, 0) 55%),
        linear-gradient(180deg, #101013 0%, #030305 100%);
      border: 1px solid rgba(100, 210, 255, 0.55);
      box-shadow:
        0 0 0 1px rgba(100, 210, 255, 0.12),
        0 0 12px rgba(100, 210, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 -6px 10px rgba(0, 0, 0, 0.55);
      color: var(--accent);
      transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    a.social::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 50%;
      pointer-events: none;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 38%);
      mix-blend-mode: screen;
    }

    a.social svg {
      position: relative;
      z-index: 1;
      width: 22px;
      height: 22px;
    }

    a.social:hover {
      transform: translateY(-1px);
      border-color: rgba(100, 210, 255, 0.85);
      box-shadow:
        0 0 0 1px rgba(100, 210, 255, 0.25),
        0 0 20px rgba(100, 210, 255, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 -6px 10px rgba(0, 0, 0, 0.55);
    }

    a.social:active {
      transform: translateY(0) scale(0.97);
    }

    footer {
      margin-top: 4px;
      text-align: center;
      font-size: 12px;
      color: rgba(245, 245, 247, 0.35);
      letter-spacing: -0.005em;
    }

    footer a {
      color: rgba(245, 245, 247, 0.55);
      text-decoration: none;
    }

    @media (max-width: 420px) {
      main { padding: 40px 16px 64px; }
      .avatar { width: 92px; height: 92px; border-radius: 22px; }
      .avatar::after { border-radius: 21px; }
      h1 { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      #shader-bg { display: none; }
    }
  </style>
</head>
<body>

  <script>

  <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var probe = document.createElement('canvas');
      var hasWebGL = !!(probe.getContext('webgl') || probe.getContext('experimental-webgl'));
      if (!hasWebGL) return;

      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/89/three.min.js';
      s.onload = startShader;
      document.head.appendChild(s);
    })();

    function startShader() {
      var THREE = window.THREE;
      var container = document.getElementById('shader-bg');
      if (!THREE || !container) return;

      var camera = new THREE.Camera();
      camera.position.z = 1;

      var scene = new THREE.Scene();
      var geometry = new THREE.PlaneBufferGeometry(2, 2);

      var uniforms = {
        time:       { type: 'f',  value: 1.0 },
        resolution: { type: 'v2', value: new THREE.Vector2() }
      };

      var vertexShader = [
        'void main() {',
        '  gl_Position = vec4(position, 1.0);',
        '}'
      ].join('\n');

      var fragmentShader = [
        'precision highp float;',
        'uniform vec2 resolution;',
        'uniform float time;',
        '',
        'float random(in float x) { return fract(sin(x) * 1e4); }',
        '',
        'void main(void) {',
        '  vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);',
        '',
        '  vec2 fMosaicScal = vec2(4.0, 2.0);',
        '  vec2 vScreenSize = vec2(256.0, 256.0);',
        '  uv.x = floor(uv.x * vScreenSize.x / fMosaicScal.x) / (vScreenSize.x / fMosaicScal.x);',
        '  uv.y = floor(uv.y * vScreenSize.y / fMosaicScal.y) / (vScreenSize.y / fMosaicScal.y);',
        '',
        '  float t = time * 0.06 + random(uv.x) * 0.4;',
        '  float lineWidth = 0.0008;',
        '',
        '  vec3 color = vec3(0.0);',
        '  for (int j = 0; j < 3; j++) {',
        '    for (int i = 0; i < 5; i++) {',
        '      color[j] += lineWidth * float(i * i) / abs(fract(t - 0.01 * float(j) + float(i) * 0.01) * 1.0 - length(uv));',
        '    }',
        '  }',
        '',
        '  // Tinted to Apple-style light blue (matches --accent #64D2FF).',
        '  // To restore original rainbow output, replace next line with:',
        '  //   gl_FragColor = vec4(color[2], color[1], color[0], 1.0);',
        '  gl_FragColor = vec4(color[2] * 0.30, color[1] * 0.75, color[0] * 1.05, 1.0);',
        '}'
      ].join('\n');

      var material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: vertexShader,
        fragmentShader: fragmentShader
      });

      var mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      var renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      function resize() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        renderer.setSize(w, h);
        uniforms.resolution.value.x = renderer.domElement.width;
        uniforms.resolution.value.y = renderer.domElement.height;
      }
      resize();
      window.addEventListener('resize', resize);

      var rafId = null;
      function animate() {
        rafId = requestAnimationFrame(animate);
        uniforms.time.value += 0.05;
        renderer.render(scene, camera);
      }
      animate();

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = null;
        } else if (rafId === null) {
          animate();
        }
      });
    }
  </script>
